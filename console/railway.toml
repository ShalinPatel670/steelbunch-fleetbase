# Railway Configuration for Fleetbase Console Service
# Service: fleetbase-console
# Runtime: Nginx serving Ember.js SPA

[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"
watchPatterns = ["./**"]
buildArgs = { DISABLE_RUNTIME_CONFIG = "false" }

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

[[deploy.ports]]
port = 4200
protocol = "http"
