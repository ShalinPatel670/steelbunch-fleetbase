# Railway Configuration for Fleetbase Scheduler
# Service: fleetbase-scheduler
# Runtime: go-crond with Laravel Scheduler

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"
dockerTarget = "scheduler-dev"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
